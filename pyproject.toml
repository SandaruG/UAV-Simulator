[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "radioenv"
version = "1.0.0"
description = "High-fidelity radio environment map (terrain, buildings, cellular, LEO satellite, weather, interference) for drone link-handover research"
requires-python = ">=3.9"
dependencies = ["numpy>=1.22", "scipy>=1.8", "fastapi>=0.110", "uvicorn>=0.27"]

[project.optional-dependencies]
plots = ["matplotlib>=3.5"]
geotiff = ["rasterio"]
tle = ["sgp4"]

[tool.setuptools]
packages = ["radioenv"]
